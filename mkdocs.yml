site_name: Xtra Computing Server Docs
site_description: Terms of use and user guides for the Xtra Computing Server
site_url: https://xtra-computing.github.io/xtra-server-terms-mkdocs/
repo_url: https://github.com/Xtra-Computing/xtra-server-terms-mkdocs
repo_name: xtra-server-terms-mkdocs
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Xtra Computing Group

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle: {icon: material/brightness-4, name: Switch to light mode}

extra_css:
  - stylesheets/extra.css


plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: 中文
          build: true
          nav_translations:
            Home: 首页
            Terms: 条款
            Terms of Use: 使用条款
            Admin Liability: 管理员责任边界
            Getting Started: 新人指南
            Overview: 概览
            Containers: 容器
            Rootless Docker (deprecated): Rootless Docker（已停用）
            Network: 网络
            Disk: 磁盘

  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started.md
      - Containers:
          - Apptainer: apptainer.md
          - Rootless Docker (deprecated): docker.md
      - Network: network.md
      - Disk: disk.md
  - Methodology: methodology.md
  - Terms:
      - Terms of Use: terms.md
      - Admin Liability: admin-liability.md

extra:
  generator: false  # hide "Made with Material for MkDocs"

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # keep unicode so Chinese anchors like #账号管理 match GitHub's slugs
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
